name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install .NET 8.0.x runtime
        run: |
          $installScript = Join-Path $env:RUNNER_TEMP 'dotnet-install.ps1'
          Invoke-WebRequest 'https://dot.net/v1/dotnet-install.ps1' -OutFile $installScript
          & $installScript -Channel 8.0 -Runtime dotnet -Architecture x64 -InstallDir $env:DOTNET_ROOT -SkipNonVersionedFiles -NoPath

      - name: Restore
        run: dotnet restore AniMeido.slnx

      - name: Build
        run: dotnet build AniMeido.slnx -c Release --no-restore

      - name: Test
        run: dotnet test AniMeido.slnx -c Release --no-build --logger trx --results-directory TestResults

      - name: Upload failed test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-windows
          path: TestResults/**/*.trx
          if-no-files-found: ignore
