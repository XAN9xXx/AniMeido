name: Release to R2

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-to-r2
  cancel-in-progress: false
  queue: max

jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      channel: ${{ steps.meta.outputs.channel }}
      artifact: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require successful main CI for this exact commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run=$(gh run list --workflow ci.yml --branch main --event push --commit "$GITHUB_SHA" \
            --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          [[ -n "$run" ]] || { echo "::error::Wait for push CI on main to pass, then retry."; exit 1; }
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Read release version and notes from the commit
        id: meta
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props -Raw)).SelectSingleNode('//AniMeidoVersion').InnerText
          if ($version -cnotmatch '\A[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?\z') { throw 'Invalid product version' }
          if (!(Test-Path -LiteralPath "docs-public/release-notes-$version.md" -PathType Leaf)) { throw 'Missing release notes' }
          $channel = if ($version.Split('+')[0].Contains('-')) { 'preview' } else { 'stable' }
          "version=$version","channel=$channel" >> $env:GITHUB_OUTPUT
      - name: Install the packaging compiler
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP inno
          $setup = Join-Path $env:RUNNER_TEMP innosetup-6.7.4.exe
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe' -OutFile $setup
          $signature = Get-AuthenticodeSignature $setup
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch '(?:^|, )O=Pyrsys B\.V\.(?:,|$)') { throw 'Invalid Inno Setup publisher signature' }
          $p = Start-Process $setup -ArgumentList ('/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /CURRENTUSER /DIR="{0}"' -f $dir) -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Inno Setup failed: $($p.ExitCode)" }
          Invoke-WebRequest 'https://raw.githubusercontent.com/jrsoftware/issrc/c2913c993858a781fcb455bac8b8949c1c366cb8/Files/Languages/Unofficial/ChineseSimplified.isl' -OutFile "$dir/Languages/ChineseSimplified.isl"
      - name: Prepare unsigned installation and update packages
        shell: pwsh
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          CHANNEL: ${{ steps.meta.outputs.channel }}
        run: |
          ./Tools/Publish-Release.ps1 -PrepareForSigning -Version $env:VERSION -Channel $env:CHANNEL -Notes "docs-public/release-notes-$env:VERSION.md" -IsccPath "$env:RUNNER_TEMP/inno/ISCC.exe"
          $files = @("AniMeido_setup_$env:VERSION.exe", "AniMeido-$env:VERSION-win-x64.zip", 'release.json')
          if ($env:CHANNEL -eq 'stable') { $files += 'version.json' }
          $assets = New-Item -ItemType Directory "$env:RUNNER_TEMP/release-assets"
          foreach ($file in $files) { Copy-Item -LiteralPath "artifacts/release/$env:VERSION/$file" -Destination $assets }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: artifact
        with:
          name: release-assets-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-assets/
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

  sign:
    needs: package
    runs-on: ubuntu-latest
    environment: release-signing
    timeout-minutes: 10
    outputs:
      signature: ${{ steps.signature.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Build production signer without credentials
        run: dotnet build Tools/AniMeido.UpdateSigner -c Release -p:AniMeidoUpdateTestSource=false -o "$RUNNER_TEMP/signer"
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          artifact-ids: ${{ needs.package.outputs.artifact }}
          path: ${{ runner.temp }}/assets
          merge-multiple: true
      - name: Sign only the release manifest
        shell: bash
        env:
          SIGNING_PEM: ${{ secrets.UPDATE_SIGNING_PEM }}
        run: |
          set -euo pipefail
          : "${SIGNING_PEM:?Missing release-signing secret UPDATE_SIGNING_PEM}"
          printf '%s' "$SIGNING_PEM" | env -u SIGNING_PEM dotnet "$RUNNER_TEMP/signer/AniMeido.UpdateSigner.dll" sign \
            --private /dev/stdin --file "$RUNNER_TEMP/assets/release.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: signature
        with:
          name: release-signature-${{ github.run_attempt }}
          path: ${{ runner.temp }}/assets/release.json.sig
          retention-days: 14
          if-no-files-found: error

  upload:
    needs: [package, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.package.outputs.version }}
      PREFIX: updates/win-x64/${{ needs.package.outputs.channel }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          artifact-ids: ${{ needs.package.outputs.artifact }},${{ needs.sign.outputs.signature }}
          path: ${{ runner.temp }}/assets
          merge-multiple: true

      - name: Build the production manifest verifier
        run: dotnet build Tools/AniMeido.UpdateSigner -c Release -p:AniMeidoUpdateTestSource=false -o "$RUNNER_TEMP/verifier"

      - name: Read current channel manifest from R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          BUCKET: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          set -euo pipefail
          : "${AWS_ACCESS_KEY_ID:?Missing R2_ACCESS_KEY_ID}" "${AWS_SECRET_ACCESS_KEY:?Missing R2_SECRET_ACCESS_KEY}" "${BUCKET:?Missing R2_BUCKET_NAME}"
          [[ "$R2_ENDPOINT" != https://.r2.cloudflarestorage.com ]] || { echo "::error::Missing R2_ACCOUNT_ID"; exit 1; }
          key="$PREFIX/release.json"
          # The exact key sorts before release.json.sig. A failed list/get is never a first release.
          first=$(aws s3api list-objects-v2 --endpoint-url "$R2_ENDPOINT" --bucket "$BUCKET" \
            --prefix "$key" --max-keys 1 --no-paginate --query 'Contents[0].Key' --output text)
          if [[ "$first" == "$key" ]]; then
            aws s3api get-object --endpoint-url "$R2_ENDPOINT" --bucket "$BUCKET" --key "$key" \
              "$RUNNER_TEMP/current.json" > /dev/null
          fi

      - name: Verify signature, ZIP and version ordering
        id: verify
        run: |
          set -euo pipefail
          current=()
          if [[ -f "$RUNNER_TEMP/current.json" ]]; then current=(--current "$RUNNER_TEMP/current.json"); fi
          mode=$(dotnet "$RUNNER_TEMP/verifier/AniMeido.UpdateSigner.dll" verify-release \
            --directory "$RUNNER_TEMP/assets" --version "$VERSION" "${current[@]}")
          case "$mode" in publish|repair) ;; *) exit 1 ;; esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Publish to R2 (discovery last)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          BUCKET: ${{ secrets.R2_BUCKET_NAME }}
          MODE: ${{ steps.verify.outputs.mode }}
        working-directory: ${{ runner.temp }}/assets
        run: |
          set -euo pipefail
          put() { aws s3 cp --only-show-errors --endpoint-url "$R2_ENDPOINT" "$1" "s3://$BUCKET/$2" "${@:3}"; }
          if [[ "$MODE" == publish ]]; then
            put "AniMeido_setup_$VERSION.exe" "AniMeido_setup_$VERSION.exe"
            put "AniMeido-$VERSION-win-x64.zip" "$PREFIX/AniMeido-$VERSION-win-x64.zip"
          fi
          put release.json.sig "$PREFIX/release.json.sig" --cache-control no-cache
          put release.json "$PREFIX/release.json" --cache-control no-cache

  website:
    needs: [package, upload]
    if: needs.package.outputs.channel == 'stable'
    runs-on: ubuntu-latest
    environment: website-release
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.package.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          artifact-ids: ${{ needs.package.outputs.artifact }}
          path: ${{ runner.temp }}/assets
          merge-multiple: true
      - name: Confirm stable release through the public download endpoint
        shell: bash
        run: |
          set -euo pipefail
          for delay in 0 10 30; do
            sleep "$delay"
            if python3 Tools/website_version.py verify-public "$VERSION" "$RUNNER_TEMP/assets"; then exit 0; fi
          done
          echo "::error::Public stable installer or manifest not ready; website left unchanged."
          exit 1
      - name: Check out the website only after the public download succeeds
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: XAN9xXx/animeido.com
          ref: main
          path: website
          ssh-key: ${{ secrets.WEBSITE_DEPLOY_KEY }}
      - name: Update only the website version feed
        shell: bash
        run: |
          set -euo pipefail
          python3 Tools/website_version.py promote "$VERSION" "$RUNNER_TEMP/assets" website/version.json
          git -C website add -- version.json
          if git -C website diff --cached --quiet -- version.json; then exit 0; fi
          git -C website -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "chore(release): 更新官网版本至 $VERSION" -- version.json
          git -C website push origin HEAD:refs/heads/main
